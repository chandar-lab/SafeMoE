# Router-only with 4 frozen, randomly initialised experts (Table 9).
# Experts come from scripts/make_random_experts.py; only the routers are trained.
defaults: base.yaml
name: router_only_random_4
model:
  experts_dir: checkpoints/experts/mistral_random
  experts: "4"
  num_experts_per_tok: 1
  trainable: router
