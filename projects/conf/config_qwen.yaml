  router_layers: [ "gate_proj", "up_proj", "down_proj"]

# Training configuration
training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1e-2
  save_total_limit: 1
  num_train_epochs: 10
  eval_steps: 5000
  logging_strategy: "steps"
  logging_steps: 25
  gradient_accumulation_steps: 4 # Increased from 4 to reduce memory usage
  bf16: false  # Changed to true - CRITICAL for memory reduction (50% less memory)
  gradient_checkpointing: true  # Enable gradient checkpointing for memory efficiency
  logging_first_step: true
  evaluation_strategy: "steps"
  save_strategy: "steps"
  save_steps: 5000
  load_best_model_at_end: false  # Changed to false - saves memory during training
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  max_seq_length: 256  # Reduced from 512 to 256 - significant memory savings


