# Experiment configuration for Qwen2.5-1.5B MoE
experiment_name: "qwen2.5_1.5B_lora_moe_router_training"
seed: 42

# Weights & Biases configuration
wandb:
  enabled: true
  project: "qwen2-moe-training"
  run_name: null  # Will use experiment_name if null
  tags: ["qwen2", "moe", "router-training"]
  notes: "Training Qwen2.5-1.5B MoE model with LoRA experts and router-only training"

# # DeepSpeed configuration
# deepspeed:
#   enabled: true
#   config_path: "conf/deepspeed_config.json"

# Model configuration
model:
  model_type: "qwen2"
  num_experts_per_tok: 2
  base_model: "Qwen/Qwen2.5-1.5B"
  experts:
    # Example LoRA experts - replace with your actual LoRA adapter paths
    - expert_name: "adapter_1"
      model_id: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/mergoo/projects/loras/Qwen2.5-1.5B-lora-drug_abuse"
    - expert_name: "adapter_2"
      model_id: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/mergoo/projects/loras/Qwen2.5-1.5B-lora-pubmedqau"
    - expert_name: "adapter_3"
      model_id: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/mergoo/projects/loras/Qwen2.5-1.5B-lora-unsafe_cybercrime"
    - expert_name: "adapter_4"
      model_id: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/mergoo/projects/loras/Qwen2.5-1.5B-lora-cybersecurity_kaggle"
    # Add more experts as needed
    # - expert_name: "adapter_5"
    #   model_id: "/path/to/your/qwen2-lora-adapter-5"
  # Router layers configuration
  # Options: ["gate_proj", "up_proj", "down_proj"] for MLP layers
  #          ["q_proj", "k_proj", "v_proj", "o_proj"] for attention layers
  router_layers: ["gate_proj", "up_proj", "down_proj"]

# Training configuration
training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1e-4
  save_total_limit: 1
  num_train_epochs: 10
  eval_steps: 500
  logging_strategy: "steps"
  logging_steps: 25
  gradient_accumulation_steps: 4
  bf16: true
  logging_first_step: true
  evaluation_strategy: "steps"
  save_strategy: "steps"
  save_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  max_seq_length: 512


# Data configuration
data:
  # Replace with your actual dataset path
  # dataset_name: "/path/to/your/training/dataset.json"
  # dataset_name: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_100samples_clean_no_overlap.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_100samples_clean_no_overlap.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_200samples_clean_no_overlap.json"
  dataset_name: "/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_economiccrime_cybercrime_environmental_damage_psychological_harm._drugabuse.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_20samples_psychological_cybercrime_economic_drug_abuse.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_mix_safe_categories_economiccrime_cybercrime_environmental_damage_psychological_harm._drugabuse.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_safe_gpt4_qtype4_psychological_harm_polished.json"
  # "/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_safe_gpt4_qtype2_economic_crime_polished.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/datasets_processing/polished_safe_data/train_safe_gpt4_qtype2_cybercrime_polished.json"
  #"/home/mila/m/maryam.hashemzadeh/scratch/saftly/MoE-PEFT/datasets/beavertail/4_cleaned_330k_train_beaverTails_safe_gpt4_qtype4_drug_abuse_weapons_banned_substance.json" #"bitext/Bitext-customer-support-llm-chatbot-training-dataset"

  # Expected format: JSON file with "prompt"/"instruction" and "response" fields
  # Example:
  # [
  #   {"prompt": "What is AI?", "response": "AI stands for Artificial Intelligence..."},
  #   {"instruction": "Explain ML", "response": "Machine Learning is..."}
  # ]
  test_size: 0.1  # 90% train, 10% test + validation
  test_valid_split: 0.7  # Split the 10% into 0.7 test, 0.3 valid

# Paths configuration
paths:
  model_checkpoint: "data/qwen2.5_1.5B_lora_moe_checkpoint_2"
  output_dir: "data/output/qwen2.5_1.5B_lora_moe_training_2"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${experiment_name}

