# Experiment configuration for Qwen2.5-1.5B MoE
experiment_name: "qwen2_lora_moe_router_training"
seed: 42

# Weights & Biases configuration
wandb:
  enabled: true
  project: "qwen2-moe-training"
  run_name: null  # Will use experiment_name if null
  tags: ["qwen2", "moe", "router-training"]
  notes: "Training Qwen2.5-1.5B MoE model with LoRA experts and router-only training"

# # DeepSpeed configuration
# deepspeed:
#   enabled: true
#   config_path: "conf/deepspeed_config.json"

# Model configuration
model:
  model_type: "qwen2"
  num_experts_per_tok: 2
  base_model: "Qwen/Qwen2.5-1.5B"
  experts:
    # Example LoRA experts - replace with your actual LoRA adapter paths
    - expert_name: "adapter_1"
      model_id: "/path/to/your/qwen2-lora-adapter-1"
    - expert_name: "adapter_2"
      model_id: "/path/to/your/qwen2-lora-adapter-2"
    - expert_name: "adapter_3"
      model_id: "/path/to/your/qwen2-lora-adapter-3"
    - expert_name: "adapter_4"
      model_id: "/path/to/your/qwen2-lora-adapter-4"
    # Add more experts as needed
    # - expert_name: "adapter_5"
    #   model_id: "/path/to/your/qwen2-lora-adapter-5"
  
  # Router layers configuration
  # Options: ["gate_proj", "up_proj", "down_proj"] for MLP layers
  #          ["q_proj", "k_proj", "v_proj", "o_proj"] for attention layers
  router_layers: ["gate_proj", "up_proj", "down_proj"]

# Training configuration
training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1e-4
  save_total_limit: 1
  num_train_epochs: 10
  eval_steps: 500
  logging_strategy: "steps"
  logging_steps: 25
  gradient_accumulation_steps: 4
  bf16: true
  logging_first_step: true
  evaluation_strategy: "steps"
  save_strategy: "steps"
  save_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  max_seq_length: 512

# GRPO configuration (Group Relative Policy Optimization)
grpo:
  enabled: false  # Set to true to enable GRPO training instead of SFT
  per_device_train_batch_size: 1  # Can be different from SFT batch size
  per_device_eval_batch_size: 1
  learning_rate: 5e-6  # Typically lower than SFT learning rate
  num_train_epochs: 3  # Usually fewer epochs than SFT
  num_generations: 4  # Number of completions to generate per prompt
  max_completion_length: 256  # Maximum length of generated completions
  max_prompt_length: 512  # Maximum length of input prompts
  temperature: 0.7  # Temperature for generation (0.0 = deterministic, 1.0 = random)
  beta: 0.0  # KL divergence coefficient (0.0 = no KL penalty)

# Llama Guard configuration for safety assessment
llama_guard:
  enabled: false  # Use actual Llama Guard model (if false, uses heuristic fallback)
  model_id: "meta-llama/Llama-Guard-3-8B"  # Llama Guard model to use
  device_map: "auto"  # Device mapping for Llama Guard model
  torch_dtype: "bfloat16"  # Data type for Llama Guard model

# Data configuration
data:
  # Replace with your actual dataset path
  dataset_name: "/path/to/your/training/dataset.json"
  # Expected format: JSON file with "prompt"/"instruction" and "response" fields
  # Example:
  # [
  #   {"prompt": "What is AI?", "response": "AI stands for Artificial Intelligence..."},
  #   {"instruction": "Explain ML", "response": "Machine Learning is..."}
  # ]
  test_size: 0.1  # 90% train, 10% test + validation
  test_valid_split: 0.7  # Split the 10% into 0.7 test, 0.3 valid

# Paths configuration
paths:
  model_checkpoint: "data/qwen2_lora_moe_checkpoint"
  output_dir: "data/output/qwen2_lora_moe_training"

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${experiment_name}

