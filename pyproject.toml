[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safemoe"
version = "0.1.0"
description = "SafeMoE: routing unsafe LoRA experts for safe and informative responses"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.1",
    "transformers==4.46.3",
    "peft==0.14.0",
    "accelerate==1.7.0",
    "datasets==3.6.0",
    "safetensors",
    "sentencepiece",
    "omegaconf",
    "openai",
    "anthropic",
]

[tool.setuptools.packages.find]
include = ["safemoe*"]
